name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Clippy's `-D warnings` goes after `--`, not into RUSTFLAGS: that would replace webusb-app/.cargo/config.toml's rustflags.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The import options in rustfmt.toml need nightly.
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo +nightly fmt --check
      - run: cargo +nightly fmt --check
        working-directory: firmware

  host:
    name: Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the desktop UI's system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
      # Installs the toolchain from rust-toolchain.toml.
      - run: rustup toolchain install && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (protocol, host library and its examples, mock firmware)
        run: cargo clippy --locked -p picolink-protocol -p picolink-host -p picolink-mock-firmware --all-targets --all-features -- -D warnings
      - name: Clippy (server)
        run: cargo clippy --locked -p picolink-app --no-default-features --features server --all-targets -- -D warnings
      - name: Clippy (desktop UI)
        run: cargo clippy --locked -p picolink-app --no-default-features --features desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p picolink-protocol -p picolink-host -p picolink-mock-firmware
      - name: Test (server)
        run: cargo test --locked -p picolink-app --no-default-features --features server

  wasm:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (web UI)
        run: cargo clippy --locked -p picolink-app --target wasm32-unknown-unknown -- -D warnings
      # From its directory, so that its .cargo/config.toml applies.
      - name: Clippy (WebUSB app)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
        working-directory: webusb-app

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      # Not --all-targets: tests would need std.
      - name: Clippy (library and examples)
        run: cargo clippy --locked --lib --examples -- -D warnings
      - name: Build the examples
        run: cargo build --locked --release --examples
      - uses: actions/upload-artifact@v7
        with:
          name: picolink-firmware
          path: |
            firmware/target/thumbv6m-none-eabi/release/examples/sensor_actuator
            firmware/target/thumbv6m-none-eabi/release/examples/pico_w_wifi

  # The WebUSB app on GitHub Pages, once everything else passed on main.
  pages-build:
    name: Pages build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [fmt, host, wasm, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      TRUNK_VERSION: 0.22.1
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C ~/.cargo/bin
      - id: pages
        uses: actions/configure-pages@v6
      # The site lives below the domain root, e.g. /picolink/. A page per firmware: the Wi-Fi one in wifi/.
      # In this order, as each build replaces its --dist directory.
      - name: Build
        run: |
          trunk build --release --locked --public-url "${{ steps.pages.outputs.base_path }}/" index.html
          trunk build --release --locked --public-url "${{ steps.pages.outputs.base_path }}/wifi/" --dist dist/wifi wifi.html
        working-directory: webusb-app
      - uses: actions/upload-pages-artifact@v5
        with:
          path: webusb-app/dist

  pages-deploy:
    name: Pages deploy
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
