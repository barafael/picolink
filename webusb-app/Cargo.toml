[package]
name = "picolink-webusb-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "WebUSB building blocks for pages that talk to a picolink device directly, without a server, and a page per firmware"

# The pages are the binaries, see index.html and wifi.html.
[lib]
name = "picolink_webusb"

[dependencies]
picolink-protocol = { path = "../protocol" }

console_error_panic_hook = "0.1"
futures-util = { version = "0.3", default-features = false }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
postcard-rpc = { workspace = true, features = ["webusb"] }
serde = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Navigator",
    "Usb",
    "UsbConfiguration",
    "UsbConnectionEvent",
    "UsbDevice",
    "UsbDeviceFilter",
    "UsbDeviceRequestOptions",
    "Window",
] }
